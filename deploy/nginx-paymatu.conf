# Sitio nuevo. Cópialo a /etc/nginx/sites-available/paymatu
# y crea el enlace: ln -s /etc/nginx/sites-available/paymatu /etc/nginx/sites-enabled/paymatu
#
# DNS: pay.matubyte.com → IP de este servidor
# TLS: certbot --nginx -d pay.matubyte.com

server {
    listen 80;
    listen [::]:80;
    server_name pay.matubyte.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
